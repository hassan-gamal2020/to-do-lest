<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ToDo Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>قائمة المهام</h1>

    <button id="toggleMode">🌙 Dark Mode</button>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة">
        <input type="date" id="dateInput">
        <button id="addBtn">إضافة</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
